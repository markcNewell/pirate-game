name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import the project
        run: godot --headless --path . --import || true

      - name: Unit tests
        run: godot --headless --path . -s tests/run_tests.gd

      - name: Bot smoke test
        run: tests/smoke/smoke_test.sh

      - name: Combat smoke test
        run: tests/smoke/combat_test.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/windows_*_x86_64.exe' 'templates/linux_*.x86_64' 'templates/version.txt' -d "$dest"
          rm templates.tpz

      - name: Export
        run: tools/export.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build
          zip -j "PirateGame-windows-${GITHUB_REF_NAME}.zip" windows/PirateGame.exe
          zip -j "pirate-game-server-linux-${GITHUB_REF_NAME}.zip" server/pirate-game-server.x86_64
          flags=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" $flags --generate-notes \
            "PirateGame-windows-${GITHUB_REF_NAME}.zip" "pirate-game-server-linux-${GITHUB_REF_NAME}.zip"
